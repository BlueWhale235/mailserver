x-mailserver-common: &mailserver-common
  restart: unless-stopped
  environment:
    Database__Provider: ${DATABASE_PROVIDER:-PostgreSql}
    ConnectionStrings__MailDatabase: ${MAIL_DATABASE_CONNECTION:-Host=postgres;Port=5432;Database=mailserver;Username=mailserver;Password=mailserver}
    MAILSERVER_CONFIG: /app/mailserver.json
    Storage__RootPath: /data/messages
    Plugins__Path: /app/plugins
    SecurityAssets__RootPath: /security-assets
    Certificates__DefaultMailHostName: ${MAIL_HOSTNAME}

services:
  postgres:
    image: postgres:18-alpine
    profiles: ["postgres"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: mailserver
      POSTGRES_USER: mailserver
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mailserver -d mailserver"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    <<: *mailserver-common
    build:
      context: .
      args:
        PROJECT: MailServer.Api
    environment:
      Database__Provider: ${DATABASE_PROVIDER:-PostgreSql}
      ConnectionStrings__MailDatabase: ${MAIL_DATABASE_CONNECTION:-Host=postgres;Port=5432;Database=mailserver;Username=mailserver;Password=mailserver}
      Storage__RootPath: /data/messages
      Plugins__Path: /app/plugins
      AdminServer__BindAddress: 0.0.0.0
      AdminServer__Http__Enabled: ${ADMIN_HTTP_ENABLED:-true}
      AdminServer__Http__Port: ${ADMIN_HTTP_PORT:-8080}
      AdminServer__Https__Enabled: ${ADMIN_HTTPS_ENABLED:-false}
      AdminServer__Https__Port: ${ADMIN_HTTPS_PORT:-8443}
      Certificates__Admin__CertificatePath: /certificates/admin-chain.pem
      Certificates__Admin__PrivateKeyPath: /certificates/admin-key.pem
      Certificates__Admin__PrivateKeyPassword: ${ADMIN_KEY_PASSWORD:-}
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
      Bootstrap__AdminUserName: ${ADMIN_USERNAME:-admin}
      Bootstrap__AdminPassword: ${ADMIN_PASSWORD}
    ports:
      - "${ADMIN_HTTP_PORT:-8080}:${ADMIN_HTTP_PORT:-8080}"
      - "${ADMIN_HTTPS_PORT:-8443}:${ADMIN_HTTPS_PORT:-8443}"
    volumes:
      - message-data:/data/messages
      - ./mailserver.json:/app/mailserver.json:ro
      - ./certificates:/certificates:ro
      - security-assets:/security-assets

  smtp:
    <<: *mailserver-common
    build:
      context: .
      args:
        PROJECT: MailServer.Smtp
    environment:
      Database__Provider: ${DATABASE_PROVIDER:-PostgreSql}
      ConnectionStrings__MailDatabase: ${MAIL_DATABASE_CONNECTION:-Host=postgres;Port=5432;Database=mailserver;Username=mailserver;Password=mailserver}
      Storage__RootPath: /data/messages
      Plugins__Path: /app/plugins
      Smtp__HostName: ${MAIL_HOSTNAME}
    volumes:
      - message-data:/data/messages
      - ./mailserver.json:/app/mailserver.json:ro
      - ./certificates:/certificates:ro
      - security-assets:/security-assets:ro
    ports:
      - "${SMTP_PORT:-25}:25"
      - "${SMTPS_PORT:-465}:465"
      - "${SUBMISSION_PORT:-587}:587"

  imap:
    <<: *mailserver-common
    build:
      context: .
      args:
        PROJECT: MailServer.Imap
    environment:
      Database__Provider: ${DATABASE_PROVIDER:-PostgreSql}
      ConnectionStrings__MailDatabase: ${MAIL_DATABASE_CONNECTION:-Host=postgres;Port=5432;Database=mailserver;Username=mailserver;Password=mailserver}
      Storage__RootPath: /data/messages
      Plugins__Path: /app/plugins
      Imap__HostName: ${MAIL_HOSTNAME}
    volumes:
      - message-data:/data/messages
      - ./mailserver.json:/app/mailserver.json:ro
      - ./certificates:/certificates:ro
      - security-assets:/security-assets:ro
    ports:
      - "${IMAP_PORT:-143}:143"
      - "${IMAPS_PORT:-993}:993"

  worker:
    <<: *mailserver-common
    build:
      context: .
      args:
        PROJECT: MailServer.Worker
    environment:
      Database__Provider: ${DATABASE_PROVIDER:-PostgreSql}
      ConnectionStrings__MailDatabase: ${MAIL_DATABASE_CONNECTION:-Host=postgres;Port=5432;Database=mailserver;Username=mailserver;Password=mailserver}
      Storage__RootPath: /data/messages
      Plugins__Path: /app/plugins
      Worker__HostName: ${MAIL_HOSTNAME}
      Relay__Host: ${RELAY_HOST:-localhost}
      Relay__Port: ${RELAY_PORT:-25}
      Relay__Security: ${RELAY_SECURITY:-StartTls}
      Relay__UseStartTls: ${RELAY_STARTTLS:-true}
      Relay__UserName: ${RELAY_USERNAME:-}
      Relay__Password: ${RELAY_PASSWORD:-}
    volumes:
      - message-data:/data/messages
      - ./mailserver.json:/app/mailserver.json:ro
      - ./certificates:/certificates:ro
      - security-assets:/security-assets:ro

  cli:
    <<: *mailserver-common
    profiles: ["tools"]
    restart: "no"
    build:
      context: .
      args:
        PROJECT: MailServer.Cli
    command: ["db", "status"]
    volumes:
      - message-data:/data/messages
      - ./mailserver.json:/app/mailserver.json:ro
      - ./certificates:/certificates:ro
      - security-assets:/security-assets

  mysql:
    image: mysql:8.4
    profiles: ["mysql"]
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: mailserver
      MYSQL_USER: mailserver
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  postgres-data:
  mysql-data:
  security-assets:
  message-data:

name: Build Linux binary

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, for example v2.0.0'
        required: true
        type: string

permissions:
  contents: read

jobs:
  linux-x64:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/MailServer.Admin/package-lock.json

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.301'

      - name: Verify administration UI
        working-directory: src/MailServer.Admin
        run: |
          npm ci
          npm run lint
          npm test
          npm run build

      - name: Verify backend
        run: dotnet test tests/MailServer.Tests/MailServer.Tests.csproj -p:SkipAdminBuild=true

      - name: Build versioned Linux binary
        id: build
        shell: bash
        run: |
          bash scripts/build-linux-release.sh "$RELEASE_VERSION"
          VERSION="${RELEASE_VERSION#v}"
          echo "version=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "package_dir=builds/releases/v$VERSION/linux-x64" >> "$GITHUB_OUTPUT"

      - name: Upload binary and checksum
        uses: actions/upload-artifact@v4
        with:
          name: mailserver-${{ steps.build.outputs.version }}-linux-x64
          path: ${{ steps.build.outputs.package_dir }}
          if-no-files-found: error
          retention-days: 30

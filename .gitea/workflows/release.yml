name: Build release packages

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform package to build
        required: true
        type: choice
        default: all
        options:
          - all
          - win-x64
          - linux-x64
          - linux-arm64
      version:
        description: Version label written to each release directory
        required: true
        type: string
        default: manual

permissions:
  contents: read
  actions: write

jobs:
  package:
    name: Package ${{ gitea.event.inputs.platform }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      SELECTED_PLATFORM: ${{ gitea.event.inputs.platform }}
      REQUESTED_VERSION: ${{ gitea.event.inputs.version }}

    steps:
      - name: Check out repository
        uses: https://github.com/actions/checkout@v4

      - name: Install .NET SDK
        uses: https://github.com/actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.301
          cache: true
          cache-dependency-path: Directory.Packages.props

      - name: Install Node.js
        uses: https://github.com/actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/MailServer.Admin/package-lock.json

      - name: Install locked administration dependencies
        working-directory: src/MailServer.Admin
        run: npm ci

      - name: Verify administration UI
        working-directory: src/MailServer.Admin
        run: |
          npm run lint
          npm test
          npm run build

      - name: Verify .NET solution
        run: |
          dotnet restore MailServer.slnx
          dotnet build MailServer.slnx --no-restore -p:SkipAdminBuild=true
          dotnet test tests/MailServer.Tests/MailServer.Tests.csproj --no-restore -p:SkipAdminBuild=true

      - name: Select runtimes
        shell: bash
        run: |
          set -eu
          case "$SELECTED_PLATFORM" in
            all) RUNTIMES="win-x64 linux-x64 linux-arm64" ;;
            win-x64|linux-x64|linux-arm64) RUNTIMES="$SELECTED_PLATFORM" ;;
            *) echo "Unsupported platform: $SELECTED_PLATFORM" >&2; exit 1 ;;
          esac

          VERSION="$(printf '%s' "$REQUESTED_VERSION" | tr -c 'A-Za-z0-9._-' '-')"
          VERSION="${VERSION#-}"
          VERSION="${VERSION%-}"
          if [ -z "$VERSION" ]; then
            VERSION="manual"
          fi

          echo "RUNTIMES=$RUNTIMES" >> "$GITEA_ENV"
          echo "PACKAGE_VERSION=$VERSION" >> "$GITEA_ENV"

      - name: Publish complete deployment directories
        shell: bash
        run: |
          set -eu
          chmod +x scripts/publish-portable.sh
          ./scripts/publish-portable.sh $RUNTIMES

      - name: Smoke test release directories
        shell: bash
        run: |
          set -eu
          for RID in $RUNTIMES; do
            printf '%s\n' "$PACKAGE_VERSION" > "builds/publish/$RID/VERSION.txt"
            test -f "builds/publish/$RID/mailserver.json"
            test -f "builds/publish/$RID/wwwroot/admin/index.html"
            test -d "builds/publish/$RID/wwwroot/admin/assets"
            case "$RID" in
              win-*) test -f "builds/publish/$RID/mailserver.exe" ;;
              *) test -x "builds/publish/$RID/mailserver" ;;
            esac
          done
          if [ -x builds/publish/linux-x64/mailserver ]; then
            builds/publish/linux-x64/mailserver help
          fi

      - name: Upload release directories
        uses: https://github.com/actions/upload-artifact@v3
        with:
          name: mailserver-${{ gitea.event.inputs.platform }}-release-directories
          path: builds/publish/
          if-no-files-found: error
          retention-days: 30
